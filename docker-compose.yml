services:
  db:
    image: postgres:16
    container_name: fintrack-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack
      POSTGRES_DB: fintrack_ai
    ports:
      - "5432:5432"
    volumes:
      - fintrack-ai-db-data:/var/lib/postgresql/data

volumes:
  fintrack-ai-db-data:
